services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: findings
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d findings"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/findings
      WEB_ORIGIN: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports: ["3000:3000"]

  web:
    build: ./web
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata: